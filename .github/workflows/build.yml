name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Check release version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import tomllib

          version = json.loads(Path('package.json').read_text())['version']
          plugin = tomllib.loads(Path('millennium.toml').read_text())['plugin']
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', version):
              raise SystemExit('package.json must have a valid release version')
          if plugin['version'] != version:
              raise SystemExit('package.json and millennium.toml versions must match')
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              if os.environ['GITHUB_REF_NAME'] != f'v{version}':
                  raise SystemExit(f'Release tag must be v{version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test and build
        run: bun run release

      - name: Save build files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: steam-recorder-memory-fix-${{ steps.version.outputs.version }}
          path: dist/steam-recorder-memory-fix.star
          if-no-files-found: error
          retention-days: 30

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: steam-recorder-memory-fix-${{ needs.build.outputs.version }}
          path: dist

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/steam-recorder-memory-fix.star \
            --verify-tag \
            --draft \
            --title "Steam Recorder Memory Fix $RELEASE_TAG" \
            --notes "Download steam-recorder-memory-fix.star and copy it into your Millennium plugins directory, then enable the plugin and restart Steam."
